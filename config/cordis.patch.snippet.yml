# 把下面整段追加到 %USERPROFILE%\.dsh\cordis.patch.yml
# 并把 <MCP_DIR> / <PROJECT> 换成真实路径（正斜杠或双反斜杠均可）
- id: mcp-structure-viewer
  name: "@deepseek-ai/dsh-mcp-client"
  config:
    serverName: structure_viewer
    transport: stdio
    command: node
    args:
      - '<MCP_DIR>/dist/mcp_entry.cjs'
    cwd: '<PROJECT>'
    env:
      BIOMOLECULAR_VIEWER_DATA_DIR: '<PROJECT>/.dsh/biomolecular-viewer/brain/dsh/scratch/sidecars/structural-biology/biomolecular_structure_viewer'
    toolCallTimeoutMs: 120000
